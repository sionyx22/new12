services:
  - type: web
    name: pccleaner-dashboard
    runtime: python
    plan: free
    rootDir: server
    buildCommand: echo "no dependencies"
    startCommand: python server.py
    healthCheckPath: /healthz
    envVars:
      - key: INGEST_KEY
        generateValue: true
      - key: SECRET_KEY
        generateValue: true
      - key: DASH_PASSWORD
        sync: false
      - key: UPDATE_REPO
        sync: false
