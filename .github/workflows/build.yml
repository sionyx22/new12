name: Build EXE
on:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyinstaller
      - run: pyinstaller --onefile --noconsole --uac-admin --name PCCleaner main.py
      - uses: actions/upload-artifact@v4
        with:
          name: PCCleaner
          path: dist/PCCleaner.exe
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: PCCleaner build ${{ github.run_number }}
          files: dist/PCCleaner.exe
